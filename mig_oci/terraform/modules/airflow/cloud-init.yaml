#cloud-config
# ============================================================
# cloud-init — VM Airflow (Oracle Linux 8)
# ============================================================
# Executado automaticamente na primeira inicialização da VM.
# Instala: Docker, Docker Compose plugin.
# Prepara estrutura de diretórios para Airflow via Docker Compose.
# Log: /var/log/cloud-init-output.log

package_update: true
package_upgrade: false

packages:
  - curl
  - git
  - python3
  - python3-pip

runcmd:
  # --- Docker CE + Compose plugin ---
  - dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
  - dnf install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker opc

  # --- Estrutura do projeto Airflow ---
  - mkdir -p /opt/airflow-fpd/{dags,plugins,config,logs}
  - chown -R opc:opc /opt/airflow-fpd
  - echo "AIRFLOW_UID=$(id -u opc)" > /opt/airflow-fpd/.env

  # --- Sinalizar conclusão ---
  - echo "cloud-init concluído em $(date)" >> /var/log/airflow-setup.log

final_message: |
  VM Airflow configurada com sucesso.
  Próximos passos (SSH como opc):
    1. scp docker-compose.yml opc@<IP>:/opt/airflow-fpd/
    2. scp dag_pipeline_fpd.py opc@<IP>:/opt/airflow-fpd/dags/
    3. scp airflow_variables_filled.json opc@<IP>:/opt/airflow-fpd/config/
    4. cd /opt/airflow-fpd && docker compose run --rm airflow-init
    5. docker compose up -d
    6. Acessar: http://<IP>:8080 (user: airflow, senha: airflow)
